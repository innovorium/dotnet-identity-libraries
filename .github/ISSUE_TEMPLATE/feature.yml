name: Feature proposal
description: Propose a focused capability or public API change
title: "[Proposal]: "
labels: [enhancement, triage]
body:
  - type: dropdown
    id: package
    attributes:
      label: Owning package
      options:
        - Innovorium.AspNetCore.Identity.Marten
        - Innovorium.OpenIddict.Marten
        - Cross-cutting repository concern
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or integration problem without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Include API, persistence, compatibility, and security implications.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope confirmation
      options:
        - label: This does not introduce legacy migration/import tooling.
          required: true
        - label: This keeps Identity and OpenIddict independently usable.
          required: true
